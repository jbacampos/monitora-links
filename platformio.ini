[platformio]
build_dir = ${sysenv.LOCALAPPDATA}\PlatformIO\build\Monitora_Links

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time

lib_deps = ArduinoJson

build_flags =
    -DESP32
    -Wall
    -Wextra

[env:esp8266]
platform = espressif8266
board = nodemcuv2
build_flags = -DESP8266

[env:esp32]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
build_flags = -DESP32
